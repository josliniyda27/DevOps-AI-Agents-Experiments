# CI/CD for the knowledge assistant. Setup and the one-time steps: docs/cicd.md.
#
#   every push and pull request:  test (Python + knowledge base, web, Terraform) and a secret scan (gitleaks)
#   push to main / manual run:    version -> build + push images to GHCR  ┐
#                                 infrastructure (Terraform: EC2 server)  ┴-> deploy (SSM) -> tag the release
#
# Release tag: v<MAJOR>.<MINOR>.<BUILD>. MAJOR.MINOR come from the VERSION file; BUILD is this workflow's run number,
# which GitHub increases by one on every run (on any branch), so builds stay unique and ordered.

name: CI/CD

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TF_DIR: deploy/aws
  TF_VERSION: "1.15.8"

jobs:
  # ------------------------------------------------------------------ test
  test-python:
    name: Test - API and knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-models-v1
      - run: pip install -r requirements.txt
      - name: Validate the knowledge base (no writes)
        run: python -m src.knowledge_base.workflow --check
      - name: Run tests (offline, no API key)
        run: python -m pytest -q

  test-web:
    name: Test - web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  test-terraform:
    name: Test - Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive deploy/aws
      - name: Validate the server configuration
        run: terraform -chdir="$TF_DIR" init -backend=false -input=false && terraform -chdir="$TF_DIR" validate
      - name: Validate the bootstrap configuration
        run: terraform -chdir="$TF_DIR/bootstrap" init -input=false && terraform -chdir="$TF_DIR/bootstrap" validate

  secret-scan:
    name: Test - no secrets in the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # scan every commit, not only the latest
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose

  # ------------------------------------------------------------------ release
  version:
    name: Version
    needs: [test-python, test-web, test-terraform, secret-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      image_prefix: ${{ steps.version.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Work out the release tag
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR, for example 0.1 (found '$base')"
            exit 1
          fi
          tag="v${base}.${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"   # registry names must be lower case
          echo "### Release \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and push - ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: .
            dockerfile: Dockerfile
          - image: web
            context: web
            dockerfile: web/Dockerfile
    env:
      IMAGE: ${{ needs.version.outputs.image_prefix }}-${{ matrix.image }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - run: echo "- \`$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  infrastructure:
    name: Infrastructure (Terraform)
    needs: [test-python, test-web, test-terraform, secret-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write          # OIDC: assume the AWS role without stored keys
    outputs:
      instance_id: ${{ steps.out.outputs.instance_id }}
      site_address: ${{ steps.out.outputs.site_address }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        run: >
          terraform -chdir="$TF_DIR" init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=knowledge-assistant/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - name: terraform plan
        run: terraform -chdir="$TF_DIR" plan -input=false -out=tfplan -var "region=${{ vars.AWS_REGION }}" -var "instance_type=${{ vars.INSTANCE_TYPE || 't3.small' }}"
      - name: terraform apply
        run: terraform -chdir="$TF_DIR" apply -input=false tfplan
      - id: out
        name: Read the outputs
        run: |
          echo "instance_id=$(terraform -chdir="$TF_DIR" output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "site_address=$(terraform -chdir="$TF_DIR" output -raw site_address)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2
    needs: [version, build, infrastructure]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ needs.infrastructure.outputs.site_address }}
    permissions:
      contents: read
      id-token: write
      packages: read           # lets this job's token pull the private images; the server uses it once, then it is deleted
    env:
      TAG: ${{ needs.version.outputs.tag }}
      IMAGE_PREFIX: ${{ needs.version.outputs.image_prefix }}
      INSTANCE_ID: ${{ needs.infrastructure.outputs.instance_id }}
      SITE: ${{ needs.infrastructure.outputs.site_address }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      BASIC_AUTH_USER: ${{ vars.BASIC_AUTH_USER || 'team' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Store the app's secrets in Parameter Store
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASIC_AUTH_HASH: ${{ secrets.BASIC_AUTH_HASH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for name in OPENAI_API_KEY BASIC_AUTH_HASH; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set (see docs/cicd.md)"; exit 1; fi
          done
          put() { aws ssm put-parameter --name "/knowledge-assistant/$1" --type SecureString --overwrite --value "$2" >/dev/null; }
          put openai-api-key "$OPENAI_API_KEY"
          put basic-auth-hash "$BASIC_AUTH_HASH"
          put ghcr-token "$GHCR_TOKEN"

      - name: Wait for the server to reach Systems Manager
        run: |
          for _ in $(seq 1 60); do
            status=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                       --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$status" = "Online" ] && { echo "Server $INSTANCE_ID is online"; exit 0; }
            echo "Waiting for $INSTANCE_ID ($status)"; sleep 10
          done
          echo "::error::The server did not come online in Systems Manager within 10 minutes"; exit 1

      - name: Deploy ${{ needs.version.outputs.tag }}
        run: |
          release=$(printf 'export IMAGE_TAG=%q API_IMAGE=%q WEB_IMAGE=%q SITE_ADDRESS=%q BASIC_AUTH_USER=%q GHCR_USER=%q AWS_REGION=%q' \
            "$TAG" "$IMAGE_PREFIX-api" "$IMAGE_PREFIX-web" "$SITE" "$BASIC_AUTH_USER" "$GITHUB_ACTOR" "$AWS_REGION")
          jq -n \
            --arg compose "$(base64 -w0 deploy/compose.release.yml)" \
            --arg script "$(base64 -w0 deploy/aws/remote-deploy.sh)" \
            --arg release "$release" \
            '{commands: [
                "set -e",
                "mkdir -p /opt/knowledge-assistant && cd /opt/knowledge-assistant",
                "echo \($compose) | base64 -d > compose.yml",
                "echo \($script) | base64 -d > deploy.sh",
                "\($release) && bash deploy.sh"
              ],
              executionTimeout: ["1800"]}' > ssm-params.json

          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
                         --comment "deploy $TAG" --parameters file://ssm-params.json --query Command.CommandId --output text)
          echo "Run Command $command_id"

          for _ in $(seq 1 180); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          echo "--- output from the server"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          echo "Status: $status"
          [ "$status" = "Success" ]

      - name: Remove the one-time registry token
        if: always()
        run: aws ssm delete-parameter --name /knowledge-assistant/ghcr-token 2>/dev/null || true

      - name: Smoke test (the site answers over HTTPS and asks for the login)
        run: |
          for _ in $(seq 1 18); do       # Caddy may still be getting its certificate
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$SITE/api/health" || true)
            [ "$code" = "401" ] && { echo "https://$SITE is up and protected"; echo "Deployed \`$TAG\` to https://$SITE" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            echo "Got '$code', retrying"; sleep 10
          done
          echo "::error::https://$SITE/api/health did not answer 401 (login required)"; exit 1

  tag:
    name: Tag the release
    needs: [version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag "${{ needs.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ needs.version.outputs.tag }}"
